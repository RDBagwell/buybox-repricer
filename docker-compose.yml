# Buy Box Repricer: the whole stack. `make up` builds, boots, migrates and seeds.
name: buybox

x-app: &app
  image: buybox-repricer-app
  env_file: .env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: buybox
    DB_USERNAME: buybox
    DB_PASSWORD: buybox
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buybox
      POSTGRES_PASSWORD: buybox
      POSTGRES_DB: buybox
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buybox -d buybox"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: migrate and seed (idempotent), then exit. Everything else waits for it.
  migrate:
    <<: *app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    command: sh -c "php artisan migrate --force && php artisan db:seed --force"
    restart: "no"

  app:
    <<: *app
    command: php-fpm
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    ports: ["8080:80"]
    depends_on: [app]
    restart: unless-stopped

  # Queue workers: reprice and push queues.
  horizon:
    <<: *app
    command: php artisan horizon
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Consumes marketplace notifications and sweeps expired cooldowns.
  listener:
    <<: *app
    command: php artisan repricer:listen
    depends_on:
      migrate: { condition: service_completed_successfully }

  scheduler:
    <<: *app
    command: php artisan schedule:work
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
