name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Pint + Larastan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, intl, pcntl
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: Pest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buybox
          POSTGRES_PASSWORD: buybox
          POSTGRES_DB: buybox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buybox -d buybox_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: buybox
      DB_PASSWORD: buybox
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, intl, pcntl
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pest
        run: vendor/bin/pest --ci

  assets:
    name: Frontend lint, Vitest, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # Wayfinder generates TypeScript route helpers from the PHP routes during the build.
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Build
        run: |
          cp .env.example .env
          php artisan key:generate
          npm run build

      - name: Lint + format (vp check)
        run: npx vp check

      - name: Types
        run: npm run types:check

      - name: Vitest
        run: npm test

      - name: Replay build (GitHub Pages bundle)
        run: npm run build:replay

  demo-image:
    name: Demo container (build + smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buybox
          POSTGRES_PASSWORD: buybox
          POSTGRES_DB: buybox_demo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buybox -d buybox_demo" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Dockerfile Render builds (no target: the last stage, "demo").
      - name: Build
        run: docker build -f docker/php/Dockerfile -t buybox-demo .

      - name: Run and smoke-test
        run: |
          docker run -d --name demo --network host \
            -e PORT=10000 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://127.0.0.1:10000 \
            -e TRUSTED_PROXIES= \
            -e DB_URL=postgres://buybox:buybox@127.0.0.1:5432/buybox_demo \
            -e REVERB_APP_ID=buybox -e REVERB_APP_KEY=smoke-key -e REVERB_APP_SECRET=smoke-secret \
            buybox-demo
          docker/demo/smoke.sh http://127.0.0.1:10000 smoke-key

      - name: Container logs
        if: always()
        run: docker logs demo 2>&1 | tail -200
