name: pages

# Publishes Replay mode (a recorded, seeded run played back in the browser) to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'resources/js/**'
      - 'resources/css/**'
      - 'public/recordings/**'
      - 'replay.html'
      - 'vite.replay.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Build replay
        env:
          # Optional: the live demo's URL (repository variable). Leave unset to ship replay only.
          VITE_LIVE_DEMO_URL: ${{ vars.LIVE_DEMO_URL }}
        run: |
          npm ci --no-audit --no-fund
          npm run build:replay
          touch dist-replay/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-replay

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
